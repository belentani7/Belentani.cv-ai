name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm DEBE instalarse antes de setup-node: con `cache: pnpm`, setup-node
      # ejecuta `pnpm store path` durante el preparo del cache.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # `@prisma/client` no exporta PrismaClient hasta que se genera el cliente.
      # Sin este paso, `tsc` falla con TS2305 en src/lib/db.ts.
      - name: Generate Prisma client
        run: pnpm db:generate
      # `pnpm typecheck` y `pnpm test` no existen en package.json:
      # los scripts reales son dev, build, start, lint, db:*
      - name: Lint
        run: pnpm lint
        continue-on-error: true
      - name: Build
        run: pnpm build
