# Gitleaks configuration for Belentani flagships
# Extends default rules and adds custom patterns

title = "Belentani Flagship"

[extend]
useDefault = true

# Custom rule: DeepSeek API keys (sk- + 32 hex)
[[rules]]
id = "deepseek-api-key"
description = "Clave de API de DeepSeek (formato sk- + 32 hex)."
regex = '''\bsk-[a-f0-9]{32}\b'''
keywords = ["sk-"]

# Custom rule: Vercel tokens
[[rules]]
id = "vercel-token"
description = "Token de Vercel"
regex = '''\bvercel_[a-zA-Z0-9]{20,}\b'''
keywords = ["vercel_"]

# No global path allowlists: they suppress entire directories by default.
# Add only narrowly scoped per-rule exceptions after verifying a false positive.
