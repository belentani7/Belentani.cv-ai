title = "Belentani Python Backend Standard"
version = "1.0.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET",
    "ASYNC", "PERF", "FURB", "RUF", "TRY",
    "PL", "PT", "ARG", "PTH", "EM", "FBT",
    "A", "ANN", "ASYNC",
]
ignore = [
    "TRY003",  # External exceptions
    "PLR0913", # Too many args
    "PLR0917", # Too many args (constructor)
    "FBT002",  # Boolean positional
    "ANN101",
    "ANN102",
    "S101",    # pytest assert
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]
"**/__init__.py" = ["D", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "belentani"]
known-third-party = ["fastapi", "pydantic", "pydantic_settings", "sqlmodel", "polars", "duckdb"]

[tool.ruff.format]
docstring-code-format = true

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
no_implicit_reexport = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-config=pyproject.toml",
    "--cov-fail-under=60",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]
